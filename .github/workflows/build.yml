name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.4.1

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4

      - name: Export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Import project
        run: godot --headless --path . --import 2>&1 | tee import.log

      - name: Smoke test (hra se spustí, odehraje kus úrovně a ukončí)
        run: |
          timeout 120 godot --headless --path . -- --smoke 2>&1 | tee smoke.log || true
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" import.log smoke.log; then
            echo "::error::Chyba ve skriptech"; exit 1
          fi
          grep -q "SMOKE OK" smoke.log || { echo "::error::Smoke test neprošel"; exit 1; }

      - name: Screenshoty
        continue-on-error: true
        run: |
          apt-get update -qq && apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 libxcursor1 libxinerama1 libxrandr2 libxi6 >/dev/null
          mkdir -p shots
          timeout 90 xvfb-run -a -s "-screen 0 1920x1200x24" godot --path . --rendering-driver opengl3 -- --shots=$PWD/shots 2>&1 | tail -20
          ls -la shots

      - name: Export Linux
        run: |
          mkdir -p build/Kladivo
          godot --headless --path . --export-release "Linux" build/Kladivo/Kladivo.x86_64
          chmod +x build/Kladivo/Kladivo.x86_64
          cp NAVOD.txt build/Kladivo/
          command -v zip >/dev/null || (apt-get update -qq && apt-get install -y -qq zip)
          cd build && zip -r Kladivo-linux.zip Kladivo

      - name: Export Web (hraní v prohlížeči na mobilu)
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          ls -la build/web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - uses: actions/upload-artifact@v4
        with:
          name: Kladivo-linux
          path: build/Kladivo-linux.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Kladivo v0.1.${{ github.run_number }}
          body: Automatické sestavení. Stáhni Kladivo-linux.zip, rozbal a spusť Kladivo.x86_64.
          files: |
            build/Kladivo-linux.zip
            shots/*.png
          make_latest: true

  web:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
